[project]
name = "songforge"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9",
  "pydantic-settings>=2.6", "sqlmodel>=0.0.22",
  # httpx is how lyrics.py talks to Ollama, so it is a runtime dependency and
  # not a test one. It used to be listed only under [test]; CI installs the
  # test extra and never noticed, while setup installs without extras and
  # produced an environment that could not import songforge.main at all.
  "httpx>=0.27",
  # Imported directly - or_, event, StaticPool, Column, IntegrityError - rather
  # than only reached through sqlmodel, so it is named here instead of relied
  # on as somebody else's transitive dependency.
  "sqlalchemy>=2.0",]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "anyio>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
