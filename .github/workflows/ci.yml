name: CI

# Everything here runs without a GPU. The backend's end-to-end paths use the
# mock runner, so the whole suite - queue, persistence, migrations, lyrics
# parsing, the budget estimator, setup's hardware detection - is testable on a
# plain CI box. That is why this is cheap enough to run on every push.

on:
  push:
    branches: [main, macos]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon, so it is the only runner that
        # exercises this branch's reason to exist: the sysctl probe, the
        # arm64 check and the Metal warnings all run on real hardware here.
        # Windows and Ubuntu stay because this branch tracks main and a
        # shared-code regression should fail here too, not only there.
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e "app/backend[test]"

      # The FLAC master is transcoded from the runner's WAV by FFmpeg, so
      # four tests skip without it. Installing it on one runner means that
      # path is actually covered; doing it on all three would add minutes
      # (Homebrew builds it) to test a transcode that is not
      # platform-specific. Ubuntu is the cheap one, so it is the one.
      - name: FFmpeg, so the FLAC path is exercised
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Test
        working-directory: app/backend
        run: python -m pytest -q -rs

  setup-detection:
    name: Setup runs with nothing installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The point of this job: setup must work on a machine where SongForge
      # has never been installed and no dependency is available, because that
      # is the only state a new user is ever in. No pip install step here, on
      # purpose - songforge.setup is standard library only and this job is
      # what keeps it that way.
      - name: Detect hardware with no dependencies at all
        run: python app/backend/songforge/setup/__main__.py --detect

      - name: Dry-run an install
        run: python app/backend/songforge/setup/__main__.py --only=backend --dry-run

  setup-detection-macos:
    name: Setup detects Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The sysctl probe and the arm64 guard cannot be tested anywhere else:
      # a test can fake a Machine, but not hw.memsize. This asserts the real
      # detection reaches the Apple branch and chooses the Metal wheel, so a
      # change that silently drops to the CPU target fails here.
      - name: Detect, and insist it found Metal
        run: |
          python app/backend/songforge/setup/__main__.py --detect | tee detected.json
          python - <<'CHECK'
          import json
          d = json.load(open("detected.json"))
          assert d["gpu"]["vendor"] == "apple", d["gpu"]
          assert d["torch"]["index_url"] is None, d["torch"]
          assert d["settings"]["quantization"] == "none", d["settings"]
          assert d["settings"]["memory_budget_gib"] > 0, d["settings"]
          assert any("VAE decoder" in w for w in d["warnings"]), d["warnings"]
          print("detected:", d["gpu"]["name"], d["settings"]["memory_budget_gib"], "GiB")
          CHECK

      - name: The launch scripts must be LF and executable
        run: |
          for f in setup.sh scripts/start-songforge.sh scripts/stop-songforge.sh; do
            test -x "$f" || { echo "$f is not executable"; exit 1; }
            bash -n "$f"
            ! grep -q $'\r' "$f" || { echo "$f has CRLF line endings"; exit 1; }
          done

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Smoke test every route
        run: node scripts/smoke.mjs
