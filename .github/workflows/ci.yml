name: CI

# Everything here runs without a GPU. The backend's end-to-end paths use the
# mock runner, so the whole suite - queue, persistence, migrations, lyrics
# parsing, the budget estimator, setup's hardware detection - is testable on a
# plain CI box. That is why this is cheap enough to run on every push.

on:
  push:
    branches: [main, macos]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the platform most people run this on; Ubuntu catches the
        # path separator and case sensitivity mistakes that Windows hides.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e "app/backend[test]"

      - name: Test
        working-directory: app/backend
        run: python -m pytest -q

  setup-detection:
    name: Setup runs with nothing installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The point of this job: setup must work on a machine where SongForge
      # has never been installed and no dependency is available, because that
      # is the only state a new user is ever in. No pip install step here, on
      # purpose - songforge.setup is standard library only and this job is
      # what keeps it that way.
      - name: Detect hardware with no dependencies at all
        run: python app/backend/songforge/setup/__main__.py --detect

      - name: Dry-run an install
        run: python app/backend/songforge/setup/__main__.py --only=backend --dry-run

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Smoke test every route
        run: node scripts/smoke.mjs
